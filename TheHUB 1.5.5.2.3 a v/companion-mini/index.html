<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Momentum Companion Mini</title>
<link rel="stylesheet" href="companion-mini.css">
</head>
<body>
  <main class="mini-shell" id="miniShell">
    <div class="mini-head">
      <div><b>🧬 Momentum Companion</b><span>Powered by real Hub activity</span></div>
      <em id="miniLevel">Lv 1</em>
    </div>
    <section class="mini-hero">
      <div class="mini-avatar" id="miniAvatar">▫️</div>
      <div class="mini-copy">
        <h1 id="miniName">Marciale Sprite</h1>
        <p id="miniMessage">Waiting for real Hub activity…</p>
        <div class="mini-xp"><i id="miniXpBar"></i></div>
        <div class="mini-meta"><span id="miniXp">0 XP</span><span id="miniProgress">0%</span><span id="miniStreak">0d streak</span></div>
      </div>
    </section>
    <div class="mini-last" id="miniLast">Last feed: none</div>
    <div class="mini-bridge" id="miniBridge">Bridge: waiting</div>
    <button class="mini-button" id="miniOpenFull" type="button">Open full Idle Hero</button>
  </main>
<script src="companion-mini.js"></script>
</body>
</html>
