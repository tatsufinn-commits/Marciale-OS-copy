<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mushoku Tensei: Taskbar Hero — Build 3</title>
  <link rel="stylesheet" href="/src/styles/variables.css">
  <link rel="stylesheet" href="/src/styles/base.css">
</head>
<body>
  <div id="game-container">
    <canvas id="game-canvas" width="600" height="400" aria-label="Mushoku Tensei companion game preview"></canvas>
    <div id="ui-overlay"><div id="save-controls"><span id="save-status" data-type="neutral">Preparing save...</span><button id="save-now" type="button">Save now</button><button id="new-game" type="button">New game</button><button id="portal" type="button">Portal</button><button id="open-chest" type="button">Open chest</button><button id="inventory" type="button">Inventory</button><button id="quests" type="button">Quests</button><button id="quests-mode" type="button">⛶ Full</button><button id="personal-quests" type="button">Personal Quests</button><button id="bounties" type="button">Bounties</button><button id="attune" type="button">Attunement</button><button id="achievements" type="button">Trophies</button><button id="story-dialogue" type="button">Story</button><button id="affinity" type="button">Bonds</button><button id="factions" type="button">Factions</button><button id="equip-first" type="button">Equip first</button><button id="craft-staff" type="button">Craft staff</button><button id="sell-first" type="button">Sell first</button><button id="roster" type="button">Roster</button><button id="zones" type="button">Zones</button><label class="ai-control">AI <select id="ai-mode"><option value="balanced">Balanced</option><option value="aggressive">Aggressive</option><option value="defensive">Defensive</option></select></label></div></div>
    <div id="hud"><div class="hud-left"></div><div class="hud-right"></div></div>
    <div id="version-badge">Aetherweave 0.3.0.8.a · Build 28 (Attunement Skill Tree)</div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
